<!DOCTYPE html>
<html>
    <head>
        <title>HTML Fundamentos</title>
    </head>
    <body style="padding-bottom: 500px;">
        <!-- 1 Titulos -->
        
        <h1>Titulo da pagina</h1>
        <h3>Um novo titulo</h3>
        <!-- 2 paragrafos -->
        <p>Descricao dos nossos servicos</p>
        <p>Mais um paragrafo</p>

        <!-- 3 Tags sem conteudo -->
        <p>Um paragrafo</p>
        <br>
        <p>segundo paragrafo</p>
        <hr>
        <p>terceiro paragrafo</p>

        <!-- 4 Comentarios -->
         <h1>Mais um titulos</h1>
        <!-- Este e um comentario-->

        <!-- 5 Atributos -->
         <a href="https://google.com">Google</a>
         <br>

        <!-- 6 Abir uma nova aba -->
         <a href="https://google.com" target="_blank">Google em uma nova aba</a>
         <br>

        <!-- 7 Imagens -->
         <img src="img/city.jpg"/>
         <br>

        <!-- 8 Atributo Alt -->
         <img src="img/nature.jpg" alt="Noite na floresta"/>
         <br>
    </body>
</html>
